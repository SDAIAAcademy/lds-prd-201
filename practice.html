<section>
<h2>اليوم 1: من الطلب إلى المشكلة</h2>
<ol>
<li><p>طلب مشرف خدمة نقل المخلفات: «نريد تطبيقًا ذكيًا للسكان». أي صياغة تصلح نتيجةً يُبنى عليها؟</p><ul><li><b>أ.</b> تطبيق ذكي يستقبل طلبات رفع المخلفات من السكان</li><li><b>ب.</b> يرفع الساكن طلبه مرة ويعرف موعد الرفع دون اتصال</li><li><b>ج.</b> عدد مستخدمي التطبيق في الشهر الأول بعد الإطلاق</li><li><b>د.</b> نموذج لغوي يفهم رسائل السكان بالعربية والإنجليزية</li></ul></li>
<li><p>في خدمة نقل المخلفات: «نريد أن يحسب النظام رسوم الرفع بحسب حجم المخلفات ونوعها، من جدول الرسوم المعتمد». أي فئة؟</p><ul><li><b>أ.</b> نموذج توليدي يقرأ الطلب ويقترح الرسوم</li><li><b>ب.</b> نموذج تنبؤي يتعلم الرسوم من الطلبات السابقة</li><li><b>ج.</b> دون أتمتة، فالرسوم مال ويقررها موظف</li><li><b>د.</b> قواعد تحسب الرسوم من جدول الرسوم المعتمد</li></ul></li>
<li><p>تقابل مراقبًا في خدمة نقل المخلفات لتعرف أين يضيع وقته. وافق على المقابلة، ولم يوافق على التسجيل. بماذا تبدأ؟</p><ul><li><b>أ.</b> صف لي آخر يوم عمل كامل، من أول بلاغ فتحته إلى آخره</li><li><b>ب.</b> ألا تتأخر البلاغات العاجلة بسبب كثرة البلاغات العادية؟</li><li><b>ج.</b> هل ستستخدم أداة ذكاء اصطناعي ترتب لك البلاغات؟</li><li><b>د.</b> سأشغّل التسجيل لنراجع كلامك لاحقًا، ثم ابدأ بما تشاء</li></ul></li>
<li><p>في خدمة المخلفات: «استفسار عن موعد» 140 تذكرة بثلاث دقائق، و«مخالفة رمي» 40 تذكرة بسبع عشرة دقيقة وإعادة فتح 30%. قرأت عشرين تذكرة «استفسار» فوجدت خمسًا منها بلاغات مخالفة. ماذا تكتب؟</p><ul><li><b>أ.</b> «استفسار عن موعد» أولًا لأنها الأكثر عددًا</li><li><b>ب.</b> الفئتان كما هما في الجدول المحوري، فالوسوم سجل رسمي</li><li><b>ج.</b> «مخالفة رمي» أولًا بالدقائق، وحجمها الحقيقي أكبر مما تقول الوسوم</li><li><b>د.</b> لا ترتيب قبل أن يُعاد وسم التذاكر كلها يدويًّا</li></ul></li>
<li><p>في خدمة نقل مخلفات البناء يطلب الراعي «روبوت محادثة للخدمة». أي صياغة تعيد الطلب نتيجةً لا ميزة؟</p><ul><li><b>أ.</b> نطلق روبوت محادثة يجيب عن أسئلة الرفع خلال الربع القادم</li><li><b>ب.</b> نستعمل نموذجًا لغويًا مدربًا على سجل طلبات الرفع</li><li><b>ج.</b> نضيف زر «اسأل المساعد» في صفحة الطلب</li><li><b>د.</b> يعرف صاحب الطلب موعد الرفع دون أن يتصل بمركز الاتصال</li></ul></li>
<li><p>إذا لم يوجد خط أساس لمقياس القيمة، فالصواب أن يُكتب ذلك صراحة ويُضاف قياسه إلى الخطة قبل البناء.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>تريد الخدمة منع حجز موعد رفع في يوم الجمعة أو في حي عليه قيد عمل منشور. ما الفئة الأنسب؟</p><ul><li><b>أ.</b> نموذج توليدي</li><li><b>ب.</b> نموذج تنبؤي</li><li><b>ج.</b> قواعد ثابتة</li><li><b>د.</b> دون أتمتة</li></ul></li>
<li><p>أي هذه المهام في خدمة نقل المخلفات أعلى تكلفة إذا أخطأ فيها النظام؟</p><ul><li><b>أ.</b> تحديد إن كانت كومة مخلفات تسد مخرج طوارئ في مبنى سكني</li><li><b>ب.</b> إعادة صياغة رسائل تأكيد المواعيد بلغة أبسط يفهمها كبار السن</li><li><b>ج.</b> تلخيص ملاحظات السائقين اليومية للمشرف</li><li><b>د.</b> اقتراح عنوان لإعلان الخدمة في الموقع</li></ul></li>
<li><p>إذا قال مشارك في المقابلة «أريد تطبيقًا يتتبع الشاحنة»، فهذه ملاحظة من نوع «مهمة» تُنقل كما هي إلى ورقة التقارب.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وافق مقاول على مقابلة عن خدمة نقل المخلفات، ورفض التسجيل الصوتي. ماذا تفعل؟</p><ul><li><b>أ.</b> تسجل الصوت وتحذف التسجيل بعد تفريغه</li><li><b>ب.</b> تكتب ملاحظاتك بيدك، ولا تذكر اسمه في عرض النتائج</li><li><b>ج.</b> تسجل بالهاتف دون صورة، فالرفض كان للتصوير</li><li><b>د.</b> تستبعد كل ما قاله من التوليف، فقد رفض أحد شروط المقابلة</li></ul></li>
<li><p>في مركز اتصال خدمة نقل المخلفات: الوسم «موعد الرفع» 300 تذكرة متوسطها 3 دقائق، والوسم «رسوم إضافية» 90 تذكرة متوسطها 14 دقيقة. أي عبارة صحيحة؟</p><ul><li><b>أ.</b> الوسمان متساويان في العبء تقريبًا</li><li><b>ب.</b> «موعد الرفع» أكبر عبئًا بالعدد والدقائق معًا</li><li><b>ج.</b> «رسوم إضافية» أكبر عبئًا بالدقائق، و«موعد الرفع» أكثر عددًا</li><li><b>د.</b> لا تمكن المقارنة دون معرفة عدد الموظفين</li></ul></li>
<li><p>قد تُحسب الرسالة الواحدة مرتين إذا أرسلها صاحبها من قناتين في الأسبوع نفسه، فيُبحث عن المكرر قبل العدّ.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من الفرصة إلى الجدوى</h2>
<ol>
<li><p>في خدمة نقل المخلفات: «يقرر النظام قبول اعتراض الساكن على مخالفة رمي المخلفات أو رفضه». أي فئة؟</p><ul><li><b>أ.</b> دون أتمتة</li><li><b>ب.</b> نموذج توليدي</li><li><b>ج.</b> نموذج تنبؤي</li><li><b>د.</b> قواعد ثابتة</li></ul></li>
<li><p>في ملخص المساعد عن خدمة المخلفات: «السائقون يتجاوزون مواعيد الرفع في الأحياء الجنوبية». وجدته في مقابلة مشرف واحد، ولا تذكره التذاكر. ماذا تفعل؟</p><ul><li><b>أ.</b> تعدّه مدعومًا: ذكره المساعد والمشرف معًا</li><li><b>ب.</b> تحذفه من الخريطة لأن المشرف قد يكون مخطئًا</li><li><b>ج.</b> تضعه في رأس الترتيب، فالمشرف يعرف الميدان أكثر من أي سجل</li><li><b>د.</b> تبقيه بعلامة «يحتاج دليلًا» وتبحث في سجل مواعيد الرفع</li></ul></li>
<li><p>شغّل فريق خدمة المخلفات أمرًا على 25 حالة ممثلة، فاجتازت 21. يقول الراعي: «إذن نطلق الميزة الشهر القادم». ما الرد الصحيح؟</p><ul><li><b>أ.</b> موافق: 84% نسبة نجاح كافية لإطلاق ميزة تكتب مسودات يراجعها موظف</li><li><b>ب.</b> المهمة ممكنة، والإطلاق يحتاج مواصفات واختبارات</li><li><b>ج.</b> العدد صغير، فنعيد التجربة على 500 حالة</li><li><b>د.</b> نطلق، ونصلح الإخفاقات الأربعة بعد الإطلاق</li></ul></li>
<li><p>عرض زميل نموذجًا أوليًّا لردود خدمة المخلفات: ست حالات من ست اجتازت، كلها عربية برمز رفض واحد. ما الاستنتاج الصحيح؟</p><ul><li><b>أ.</b> النموذج ينجح في 100% من رسائل السكان</li><li><b>ب.</b> النموذج لا يصلح، لأن حالات العرض لا تُصدَّق</li><li><b>ج.</b> ينجح في شريحة واحدة، والبقية لم تُجرَّب</li><li><b>د.</b> نضيف ست حالات عربية أخرى برمز واحد لنتأكد</li></ul></li>
<li><p>في سجل خدمة المخلفات، أكثر الإخفاقات أن الرد يذكر رسومًا قديمة، لأن جدول الرسوم تغير هذا العام ويتغير كل عام. ما العلاج الأنسب؟</p><ul><li><b>أ.</b> إعطاء جدول الرسوم الحالي للنموذج مع كل طلب</li><li><b>ب.</b> تكييف النموذج على مئات الردود التي فيها الرسوم الجديدة</li><li><b>ج.</b> استبدال النموذج بنموذج أكبر حجمًا</li><li><b>د.</b> جملة في الأمر تقول: «لا تذكر رسومًا قديمة»</li></ul></li>
<li><p>ملخص كتبه مساعد من مقابلات خدمة نقل المخلفات يُعدّ مصدرًا ثانيًا لادعاء ورد في إحدى هذه المقابلات.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>يريد فريق خدمة نقل المخلفات تجربة أمر على نموذج مستضاف. أي هذه يجوز إرساله إليه، بقاعدة الجهة ومبادئ الذكاء الاصطناعي التوليدي؟</p><ul><li><b>أ.</b> تصدير كامل لرسائل السكان في الشهر الماضي بأسمائهم وعناوينهم وأرقامهم</li><li><b>ب.</b> رسائل حُذف منها ما يعرّف بشخص، وصنّفها مالكها «عام»</li><li><b>ج.</b> عينة من عشرين رسالة حُذفت منها أرقام الهواتف فقط</li><li><b>د.</b> رسائل البريد الداخلية بين المراقبين عن الأحياء</li></ul></li>
<li><p>في سجل النموذج الأولي يكتب الإنسان الحكم ونوع الإخفاق لكل صف، ولا يتركهما للنموذج الذي كتب المخرج.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي مجموعة من ثلاثين رسالة تختبر بها مسودات الرد في خدمة نقل المخلفات؟</p><ul><li><b>أ.</b> أحدث ثلاثين رسالة عربية وصلت هذا الأسبوع</li><li><b>ب.</b> ثلاثون رسالة اختارها رئيس الفريق لأنها أمثلة واضحة</li><li><b>ج.</b> ثلاثون رسالة أخفق فيها النظام القديم</li><li><b>د.</b> ثلاثون بنسب اللغتين، فيها حالات حدّية وحالات تصعيد</li></ul></li>
<li><p>نتيجة مسودات خدمة المخلفات على 30 حالة: 20 اجتازت؛ العربية 17 من 20، والإنجليزية 3 من 10. أي عبارة صحيحة؟</p><ul><li><b>أ.</b> الإنجليزية أضعف: 3 من 10، مقابل 17 من 20 في العربية</li><li><b>ب.</b> النظام ينجح في ثلثي الرسائل بالتساوي بين اللغتين</li><li><b>ج.</b> 67% نتيجة مقبولة، فلا حاجة إلى النظر في الشرائح</li><li><b>د.</b> لا حكم ممكنًا، لأن الحالات الإنجليزية عشر فقط من ثلاثين</li></ul></li>
<li><p>في سجل خدمة المخلفات لم تُحَل إلى المراقب رسالتان تذكران كومة تسد مخرج طوارئ. ما العلاج الأنسب؟</p><ul><li><b>أ.</b> تكييف النموذج على رسائل سابقة فيها بلاغات خطر</li><li><b>ب.</b> نموذج أكبر حجمًا يفهم الرسائل التي لا تذكر كلمة «خطر» صراحة</li><li><b>ج.</b> قاعدة تحيل رسائل الخطر إلى موظف، وحالات خطر في التقييم</li><li><b>د.</b> جملة في الأمر وحدها: «أحِل كل بلاغ خطر»</li></ul></li>
<li><p>قرار «نتوقف» في مذكرة الجدوى قد يكون نتيجة ناجحة للنموذج الأولي إذا كان مسببًا بأرقام السجل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: من الجدوى إلى المواصفات</h2>
<ol>
<li><p>سجل خدمة المخلفات: 19 من 25 اجتازت، ومنها بلاغا خطر من ثلاثة لم يُحالا إلى المراقب. أي قرار تكتبه في مذكرة الجدوى؟</p><ul><li><b>أ.</b> نكمل كما هو: 76% نسبة جيدة لنموذج أولي</li><li><b>ب.</b> نكمل بنطاق أضيق: بلاغات الخطر تذهب إلى موظف بقاعدة</li><li><b>ج.</b> نتوقف، لأن أي إخفاق في بلاغات الخطر يكفي لإلغاء الميزة كلها</li><li><b>د.</b> نكمل، ونضيف إلى الأمر جملة عن الخطر</li></ul></li>
<li><p>رسالة إلى خدمة المخلفات: «رفضتم طلبي برمز M2، وبالمناسبة الكومة اللي قدام العمارة سدت باب الطوارئ». ماذا تفعل الميزة بحسب مواصفات جيدة؟</p><ul><li><b>أ.</b> تشرح الرمز M2 وما يلزم، وتكتفي بذلك</li><li><b>ب.</b> ترفض الرد لأن في الرسالة موضوعين مختلفين</li><li><b>ج.</b> تحيل البلاغ إلى المراقب فورًا، ثم تشرح الرمز</li><li><b>د.</b> تطلب من الساكن أن يرسل البلاغ في رسالة منفصلة</li></ul></li>
<li><p>أي هذه يصلح معيار قبول لمسودات ردود خدمة المخلفات؟</p><ul><li><b>أ.</b> نبرة المسودة مناسبة لساكن غاضب</li><li><b>ب.</b> يفهم الساكن من المسودة ما المطلوب منه</li><li><b>ج.</b> أخطاء المسودة قليلة ومقبولة</li><li><b>د.</b> ذُكر كل رمز رفض مسجل على الطلب</li></ul></li>
<li><p>مجموعة تقييم لخدمة المخلفات من 40 مثالًا: 36 معتادة بالعربية، و4 حدّية، ولا شيء يجب رفضه أو تصعيده. ماذا تقول؟</p><ul><li><b>أ.</b> غير جاهزة: لا رفض ولا تصعيد ولا إنجليزية فيها</li><li><b>ب.</b> جاهزة: 40 مثالًا عدد كافٍ لمجموعة أولى</li><li><b>ج.</b> جاهزة: الأمثلة تمثل الرسائل بنسبها في الواقع</li><li><b>د.</b> غير جاهزة: نضيف 40 مثالًا معتادًا آخر</li></ul></li>
<li><p>سجل رسائل السكان في خدمة المخلفات مصنف «مقيّد». حذف منه زميل الأسماء بنفسه، ويريد إرساله الآن إلى أداة توليدية مستضافة. ما الرد؟</p><ul><li><b>أ.</b> يُرسل، فالأسماء حُذفت والباقي لا يعرّف بأحد</li><li><b>ب.</b> لا يُرسل حتى يعيد مالكه تصنيفه ويُعتمد المستوى</li><li><b>ج.</b> يُرسل إذا وافق رئيس الزميل شفهيًّا على الإرسال</li><li><b>د.</b> يُرسل بعد حذف أرقام الهواتف أيضًا</li></ul></li>
<li><p>في مواصفات مسودات الرد لخدمة نقل المخلفات، رسالة تقول: «ألغوا مخالفتي، وعلى فكرة الحاوية مائلة على الرصيف والناس يمشون في الشارع». ماذا تنص القاعدة الصحيحة؟</p><ul><li><b>أ.</b> ترفض الميزة الإلغاء وتكتفي بتوجيه الساكن إلى لجنة الاعتراضات</li><li><b>ب.</b> تحيل الحاوية إلى المراقب فورًا، ثم ترفض الإلغاء وتوجه للجنة</li><li><b>ج.</b> تصعّد الرسالة كلها إلى لجنة الاعتراضات لأنها تعرف المخالفات</li><li><b>د.</b> تشرح للساكن شروط الاعتراض، وتنتظر رسالة ثانية عن الحاوية</li></ul></li>
<li><p>في مواصفات السلوك تكفي قاعدة رفض مهذبة وواضحة لبلاغ عن خطر على السلامة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي هذه يصلح معيار قبول ثنائيًّا لمسودات ردود خدمة نقل المخلفات؟</p><ul><li><b>أ.</b> المسودة واضحة ويفهمها الساكن من أول قراءة</li><li><b>ب.</b> المسودة تعامل الساكن الغاضب بطريقة مناسبة</li><li><b>ج.</b> أخطاء المسودة قليلة ولا تؤثر في المعنى</li><li><b>د.</b> لا موعد في المسودة إلا المسجل على الطلب</li></ul></li>
<li><p>تكفي كتابة معايير القبول بعد قراءة سجل النموذج الأولي، لأن ثلاثين حالة تكشف كل الأخطاء المهمة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>طبّق زميلان معايير خدمة المخلفات على عشرة مخرجات فاتفقا على ستة، وثلاثة من الخلافات الأربعة في معيار «الرد مهني». ما الخطوة التالية؟</p><ul><li><b>أ.</b> يُعاد كتابة المعيار سؤالًا جوابه نعم أو لا</li><li><b>ب.</b> يُحذف المعيار، فالخلاف عليه يعني أنه بلا قيمة</li><li><b>ج.</b> يحكم بينهما زميل ثالث، ويُعتمد حكم الأغلبية</li><li><b>د.</b> يُقبل 6 من 10، فالاتفاق الكامل غير ممكن</li></ul></li>
<li><p>استعمل فريق خدمة المخلفات مئتي رد معتمد في تكييف النموذج، ثم أخذ منها خمسين لمجموعة التقييم. ما المشكلة؟</p><ul><li><b>أ.</b> لا مشكلة: ردود معتمدة هي أفضل ما يُقاس عليه</li><li><b>ب.</b> خمسون مثالًا أقل مما تحتاجه مجموعة تقييم أولى</li><li><b>ج.</b> أمثلة رآها النموذج في التكييف لا تقيس أداءه</li><li><b>د.</b> يجب أن تكون مجموعة التقييم أكبر من مجموعة التكييف</li></ul></li>
<li><p>في مجموعة التقييم يُوسم كل مثال بنوعه وبالسلوك المتوقع، لا بنص الرد الصحيح حرفيًّا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مجموعة تقييم أولى لخدمة نقل المخلفات من 40 مثالًا: 30 معتادة، و6 حدّية، و4 يجب رفضها أو تصعيدها؛ ولا مثال فيه الرمز M5. ما الحكم؟</p><ul><li><b>أ.</b> جاهزة: فيها الأنواع الثلاثة كلها، والمجموع أربعون</li><li><b>ب.</b> غير جاهزة: نستبدل بها أربعين مثالًا حدّيًّا</li><li><b>ج.</b> جاهزة إذا اجتاز النموذج كل الأمثلة الأربعين</li><li><b>د.</b> غير جاهزة: الرمز M5 غائب، فتُضاف أمثلة تغطيه</li></ul></li>
<li><p>مجموعة التقييم الأولى تُسلَّم مع المواصفات، فهي تعرّف بالأمثلة متى تُعدّ الميزة جاهزة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>بند تغطية لم يبلغ هدفه لأن المرشحين لا يكفون يُترك دون ذكر، ما دام المجموع بلغ خمسين.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>يطلب فريق خدمة نقل المخلفات «كل صور الكومات من السنة الماضية» لمجموعة التقييم، ولا غرض مكتوبًا للطلب. في الصور وجوه ولوحات سيارات. ماذا يكتب بيان البيانات؟</p><ul><li><b>أ.</b> نطلب الصور كلها كما هي من أرشيف المراقبين</li><li><b>ب.</b> نطلب الصور ونطمس الوجوه واللوحات بأنفسنا</li><li><b>ج.</b> نؤجل كل طلب للبيانات حتى يبدأ البناء</li><li><b>د.</b> نكتب الغرض ونطلب ما يكفيه بموافقة المالك</li></ul></li>
<li><p>في بيان البيانات لخدمة المخلفات، مدير المنتج يطلب سجل الرسائل للتقييم. من يوافق، بقاعدة الفصل بين المهام؟</p><ul><li><b>أ.</b> المالك يوافق، ومراجِع التصنيف يعتمد</li><li><b>ب.</b> مدير المنتج يوافق على طلبه بنفسه</li><li><b>ج.</b> الفريق الهندسي الذي سيستعمل البيانات يوافق</li><li><b>د.</b> لا موافقة لازمة لسجل داخل الجهة</li></ul></li>
<li><p>سجل مصنف «مقيّد» يصبح «عامًا» إذا حذف منه مستعمله الأسماء بنفسه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في دفاع عن حزمة لخدمة المخلفات تقرر اللجنة قيدًا: «تُكتب كل الردود بالعربية، ولو كتب الساكن بالإنجليزية». أي تعديل يذكر أثر القيد كما يجب؟</p><ul><li><b>أ.</b> لا تعديل: القيد عن اللغة، والحزمة عن السلوك</li><li><b>ب.</b> يتغير معيار اللغة والسلوك المتوقع للإنجليزية</li><li><b>ج.</b> تُحذف الأمثلة الإنجليزية من مجموعة التقييم</li><li><b>د.</b> تُترجم كل رسالة إنجليزية قبل أن تصل إلى النموذج</li></ul></li>
</ol>
